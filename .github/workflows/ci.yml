name: CI

# Lint, unit tests and a production build on every push and pull request.
# Deploys stay manual (vercel.json turns git deploys off), so this only checks.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci          # postinstall runs prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build   # no database needed; every data page renders per request

  # The real flows in a browser, against a throwaway database seeded with the demo company:
  # sign-in for every role, a time-off request through the whole approval chain (the balance
  # drops by exactly the hours taken), and nobody - not even the admin - offered their own request.
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canopy
          POSTGRES_PASSWORD: canopy
          POSTGRES_DB: canopy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U canopy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://canopy:canopy@localhost:5432/canopy
      AUTH_SECRET: ci-only-not-a-secret-just-a-long-random-enough-string
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
